<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>てラボ みんなの日本語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Thai:wght@400;600;700&family=Klee+One:wght@400;600&family=Mali:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&family=Mitr:wght@400;500&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+Thai:wght@400;700&display=swap">
<style>
/* Layout: header + sticky 5-tab bar (home KPI / grammar / vocab / practice / hist), one column max 960px.
   Skins via [data-skin] on <html>; no skin = follows system light/dark. Fonts via [data-font]. */
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#24232a; --muted:#67646f; --line:#e2dfd7;
  --accent:#2f4a7a; --on-accent:#ffffff; --soft:#ebeff6;
  --ok:#23824f; --ok-soft:#e3f4ea; --ng:#cc3434; --ng-soft:#fbe5e5;
  --g1:#d1453b; --g1-soft:#fbe6e3; --g1-ink:#a32c23;
  --g2:#2f6fd0; --g2-soft:#e3edfb; --g2-ink:#1f50a0;
  --g3:#d9a400; --g3-soft:#fbf1cf; --g3-ink:#7f5d00;
  --jp:"Noto Sans JP","Hiragino Sans",sans-serif; --th:"Noto Sans Thai","Leelawadee UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-skin]){
  --bg:#141418; --card:#1e1e24; --ink:#ecebf0; --muted:#a3a1ad; --line:#34333c;
  --accent:#a3b8ec; --on-accent:#141418; --soft:#262a36;
  --ok:#5fcf8f; --ok-soft:#1d3327; --ng:#f07a7a; --ng-soft:#3d2224;
  --g1:#ef7d72; --g1-soft:#3d2422; --g1-ink:#f3a198; --g2:#79a8f0; --g2-soft:#1f2c42; --g2-ink:#a7c6f6;
  --g3:#e8c04a; --g3-soft:#3a3220; --g3-ink:#f0d27a; color-scheme:dark}}
:root[data-theme="dark"]:not([data-skin]),:root[data-skin="black"]{
  --bg:#141418; --card:#1e1e24; --ink:#ecebf0; --muted:#a3a1ad; --line:#34333c;
  --accent:#a3b8ec; --on-accent:#141418; --soft:#262a36;
  --ok:#5fcf8f; --ok-soft:#1d3327; --ng:#f07a7a; --ng-soft:#3d2224;
  --g1:#ef7d72; --g1-soft:#3d2422; --g1-ink:#f3a198; --g2:#79a8f0; --g2-soft:#1f2c42; --g2-ink:#a7c6f6;
  --g3:#e8c04a; --g3-soft:#3a3220; --g3-ink:#f0d27a; color-scheme:dark}
:root[data-skin="white"]{--bg:#ffffff; --card:#ffffff; --ink:#1f1f24; --muted:#64626c; --line:#e3e2e7; --accent:#2f4a7a; --on-accent:#fff; --soft:#f1f3f8}
:root[data-skin="pink"]{--bg:#fdf2f6; --card:#ffffff; --ink:#3a2330; --muted:#86607a; --line:#f1d3df; --accent:#c2386e; --on-accent:#fff; --soft:#fbe3ec}
:root[data-skin="blue"]{--bg:#eff5fc; --card:#ffffff; --ink:#1b2939; --muted:#5a6c84; --line:#d3e1f1; --accent:#1d68bd; --on-accent:#fff; --soft:#e0ecf9}
:root[data-skin="gold"]{--bg:#faf5e6; --card:#fffdf6; --ink:#2d2513; --muted:#75684a; --line:#e8dcba; --accent:#8c6200; --on-accent:#fff; --soft:#f4e8c6}
:root[data-skin="gray"]{--bg:#f0f0f2; --card:#ffffff; --ink:#212226; --muted:#62646b; --line:#d9d9de; --accent:#474a53; --on-accent:#fff; --soft:#e4e4e8}
:root[data-font="hand"]{--jp:"Klee One","Noto Sans JP",serif; --th:"Mali","Noto Sans Thai",sans-serif}
:root[data-font="round"]{--jp:"M PLUS Rounded 1c","Noto Sans JP",sans-serif; --th:"Mitr","Noto Sans Thai",sans-serif}
:root[data-font="serif"]{--jp:"Noto Serif JP","Noto Sans JP",serif; --th:"Noto Serif Thai","Noto Sans Thai",serif}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--th),var(--jp);font-size:16px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jp{font-family:var(--jp)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mut{color:var(--muted)}
.sm{font-size:14px}

header .wrap{padding-block:18px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brand{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--muted)}
.logo{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 12px;font-family:var(--jp)}
header h1{font-family:var(--jp);font-size:38px;line-height:1.1;margin-top:8px}
header .sub{font-weight:600;font-size:17px}

.btn{white-space:nowrap;font:inherit;font-size:15px;font-weight:600;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--ng);color:var(--ng)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.say{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer;display:inline-grid;place-items:center}
.say svg{width:18px;height:18px}

#settings{border-bottom:1px solid var(--line);background:var(--card)}
#settings .wrap{padding-block:14px;display:grid;gap:14px}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sw i{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.fo{min-height:56px;padding:6px 14px;border-radius:12px;text-align:left;display:grid;gap:0;line-height:1.3}
.fo b{font-size:17px}.fo span{font-size:12px;color:var(--muted)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{padding-block:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;font:inherit;font-weight:600;font-size:15px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

main .wrap{padding-block:22px 120px}
.panel{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card>h2{font-size:20px;display:flex;gap:10px;align-items:baseline}
.card>h2 .n{font-family:var(--jp);color:var(--muted);font-size:15px}
.stack{display:grid;gap:12px}
.inner{background:var(--bg);border-radius:12px;padding:12px}

.gb{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.gb i{width:10px;height:10px;border-radius:50%}
.gb.g1{background:var(--g1-soft);color:var(--g1-ink)}.gb.g1 i{background:var(--g1)}
.gb.g2{background:var(--g2-soft);color:var(--g2-ink)}.gb.g2 i{background:var(--g2)}
.gb.g3{background:var(--g3-soft);color:var(--g3-ink)}.gb.g3 i{background:var(--g3)}
.soft1{background:var(--g1-soft)}.soft2{background:var(--g2-soft)}.soft3{background:var(--g3-soft)}
.ink1{color:var(--g1-ink)}.ink2{color:var(--g2-ink)}.ink3{color:var(--g3-ink)}

.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.poster{border-radius:16px;padding:14px;display:grid;gap:6px;text-decoration:none;color:var(--ink);min-height:120px;align-content:space-between}
.poster .c{font-size:14px;font-weight:700}
.poster .t{font-family:var(--jp);font-size:26px;font-weight:700;line-height:1.1}
.poster .l{font-family:var(--jp);font-weight:600}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jumps a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
section[id]{scroll-margin-top:80px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:13px;color:var(--muted);font-weight:600}
.rules{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.rules li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-radius:12px;padding:10px 12px}
.big{font-size:22px;font-weight:700}
.dash{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ex li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px 12px}
.ex .j{font-family:var(--jp);font-size:18px;font-weight:700;white-space:pre-line;line-height:1.5}
.pat{font-family:var(--jp);font-size:24px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
select{font:inherit;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;flex:1;min-width:0}
.mix{border-radius:16px;padding:16px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

input[type=text],input[type=search]{font:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;min-width:0;flex:1 1 160px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.word{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.word>div{min-width:0;display:grid;gap:2px}
.word .j{font-family:var(--jp);font-size:20px;font-weight:700}
.kb{font:inherit;font-size:13px;font-weight:600;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.kb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* practice */
.recbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:10;border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line)}
.recbar.on{border-color:var(--ng);box-shadow:inset 0 0 0 1px var(--ng)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ng);display:inline-block;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.score{font-family:var(--jp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.q{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px;display:grid;gap:10px;transition:border-color .2s}
.q.ok{border-color:var(--ok);background:var(--ok-soft)}
.q.ng{border-color:var(--ng);background:var(--ng-soft)}
.qh{display:flex;gap:10px;align-items:flex-start}
.qh .num{font-weight:700;padding-top:8px;font-variant-numeric:tabular-nums;min-width:20px}
.qh .j{font-family:var(--jp);font-size:24px;font-weight:700;line-height:1.3}
.q input{font-family:var(--jp);font-size:18px;border-width:2px}
.q.ok input{border-color:var(--ok)}
.q.ng input{border-color:var(--ng)}
.res{font-weight:600;min-height:1.6em}
.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
.ch{white-space:normal;width:100%;justify-content:flex-start;text-align:left;font-family:var(--jp);font-weight:600;border-width:2px;min-height:46px;height:auto;padding:8px 14px;border-radius:12px}
.ch.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.ch.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ink)}
.ch:disabled{opacity:1;cursor:default}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gpick .ch{justify-content:center}
.result{border:2px solid var(--ok);background:var(--ok-soft);border-radius:16px;padding:16px;display:grid;gap:10px}

.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk,.lv button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;line-height:1.35}
.pk b{font-size:18px}.pk span,.lv span{font-size:13px;color:var(--muted)}
.pk em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:0 6px}
.pk[aria-pressed="true"],.lv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pk[aria-pressed="true"] span,.lv button[aria-pressed="true"] span,.pk[aria-pressed="true"] em{color:var(--on-accent);background:transparent}
.pk:disabled,.lv button:disabled{cursor:not-allowed;opacity:.55}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv b{font-size:16px}
.listen{flex:none}.listen svg{width:18px;height:18px}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card)}
.slot.ok{border-style:solid;border-color:var(--ok)}.slot.ng{border-style:solid;border-color:var(--ng)}
.chip{font-family:var(--jp);font-size:17px;font-weight:600;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent)}
.chip:disabled{cursor:default}
.ch.th{font-family:var(--th)}
.lnav{margin-top:10px;gap:6px}.lnav .btn{min-height:38px}
#lessons{border-bottom:1px solid var(--line);background:var(--card)}
#lessons .wrap{padding-block:14px;display:grid;gap:10px}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lb{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;display:grid;gap:1px;line-height:1.3;min-width:0}
.lb b{font-family:var(--jp);font-size:18px}.lb span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb em{font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}
.lb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.lb[aria-pressed="true"] span,.lb[aria-pressed="true"] em{color:var(--on-accent)}
.lrow{font:inherit;color:var(--ink);text-align:left;background:var(--bg);border:0;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;cursor:pointer;align-items:center}
.lrow .meter{grid-column:1/-1}.lrow b{font-variant-numeric:tabular-nums}
.legend>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.legend>summary::-webkit-details-marker{display:none}
.lgd{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.lgd>div{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;font-family:var(--jp);white-space:nowrap;border:1px solid var(--line)}
.symline{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.sp{display:inline-flex;gap:6px;align-items:center}
.srow{display:flex;gap:10px;align-items:center}.srow p{min-width:0;flex:1}
.steps{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.step{display:grid;gap:4px;padding-top:8px;border-top:1px dashed var(--line)}.step:first-of-type{border-top:0;padding-top:0}
.chain{font-size:19px;font-weight:700}
.means{margin:0;padding-left:20px;display:grid;gap:10px}.means li{display:grid;gap:2px}
.warn2{border-color:var(--ng)}.warn2 b{color:var(--ng)}
.gbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.gsec{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);scroll-margin-top:80px}
.ghead{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--accent);color:var(--on-accent);border:0;font:inherit;font-size:19px;font-weight:700;text-align:left;cursor:pointer;line-height:1.35}
.ghead .gtitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.ghead .n{color:var(--on-accent);opacity:.75;font-family:var(--jp);font-size:15px;border:1px solid currentColor;border-radius:999px;padding:0 8px}
.ghead .chev{margin-left:auto;flex:none;font-size:16px;transition:transform .2s}
.gsec.closed .chev{transform:rotate(-90deg)}
.gsec.closed{border-color:var(--accent)}
.ghead:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.gbody{padding:16px;display:grid;gap:12px}
.gfoot{justify-self:end;font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:var(--soft);border:1px solid var(--line);border-radius:999px;min-height:38px;padding:0 14px;cursor:pointer}
/* home */
.hero{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .d{font-size:13px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--ng)}
.meter{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:220px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}
.dr{display:grid;gap:6px}
.dr .row{justify-content:space-between}
.miss{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.miss li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 12px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:22px;display:grid;gap:10px;justify-items:start;background:var(--card)}

/* hist */
details.ses{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.ses>summary{list-style:none;cursor:pointer;padding:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
details.ses>summary::-webkit-details-marker{display:none}
details.ses[open]>summary{border-bottom:1px solid var(--line)}
.ses .body{padding:6px 14px 14px;display:grid;gap:14px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}

  if(v.group==="III"){const s=v.masu.endsWith("します");return{formula:s?"します → して":"きます → きて",detail:s?"กลุ่มเหลือง คำที่ลงท้าย します เปลี่ยนเป็น して รวมคำนาม + します":"กลุ่มเหลือง きます จำเป็น きて"}}
  const stem=v.masu.slice(0,-2),last=stem.slice(-1);
  if(v.group==="II")return{formula:`${stem} + て`,detail:TRAP.has(last)?"เสียงหน้า ます ดูเหมือนกลุ่มแดง แต่คำนี้เป็นกลุ่มน้ำเงิน ตัด ます แล้วเติม て":"กลุ่มน้ำเงิน ตัด ます แล้วเติม て ไม่เปลี่ยนเสียงท้าย"};
  const to=I_TO[last];return{formula:to?`${stem.slice(0,-1)} + ${to}`:v.te,detail:to?`เสียง ${last} เป็นกลุ่มแดง เปลี่ยนท้ายเป็น ${to}`:"จำรูป て ของคำนี้ทั้งคำ"};
}

const sesScore=s=>{const ok=s.items.filter(i=>i.firstOk).length;return{ok,total:s.items.length,p:pct(ok,s.items.length)}};
function streak(){
  const days=new Set(hist.map(s=>new Date(s.end).toDateString()));
  let d=new Date(),n=0;if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);
  while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n;
}
function drawChart(){
  const box=$("#chart");if(!box)return;
  const data=hist.slice(-12),w=box.clientWidth||600,h=220,pl=34,pr=8,pt=18,pb=26,pw=w-pl-pr,ph=h-pt-pb;
  const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim();
  const step=pw/data.length,bw=Math.min(40,step*.6),y=v=>pt+ph-v/100*ph;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="กราฟคะแนนแต่ละครั้ง">`;
  [0,50,100].forEach(v=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${col("--line")}" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${col("--muted")}">${v}</text>`});
  data.forEach((ses,i)=>{const sc=sesScore(ses),x=pl+step*i+(step-bw)/2,top=y(sc.p),bh=Math.max(0,y(0)-top),last=i===data.length-1;
    const fill=last?col("--accent"):col("--accent")+"88";
    if(bh>0){s+=`<rect x="${x}" y="${top}" width="${bw}" height="${bh}" rx="4" fill="${fill}"/>`;if(bh>4)s+=`<rect x="${x}" y="${y(0)-4}" width="${bw}" height="4" fill="${fill}"/>`}
    s+=`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="${col("--muted")}">#${ses.n}</text>`;
    if(last)s+=`<text x="${x+bw/2}" y="${top-5}" text-anchor="middle" font-size="12" font-weight="700" fill="${col("--ink")}">${sc.p}%</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${pl+step*i}" y="${pt}" width="${step}" height="${ph}" fill="transparent" tabindex="0"/>`;
  });
  box.innerHTML=s+"</svg><div class=\"tip\" hidden></div>";
  const tip=box.querySelector(".tip");
  const show=el=>{const i=+el.dataset.i,ses=data[i],sc=sesScore(ses);tip.textContent=`ครั้งที่ ${ses.n} · บท ${sesL(ses)} · ${sc.p}% · ถูก ${sc.ok}/${sc.total} · ${fmtDate(ses.end)}`;tip.hidden=false;
    const cx=(pl+step*i+step/2)/w*box.clientWidth;tip.style.left=Math.min(Math.max(cx,tip.offsetWidth/2),box.clientWidth-tip.offsetWidth/2)+"px";tip.style.top=(y(sc.p)/h*220)+"px"};
  box.querySelectorAll(".hit").forEach(el=>{el.addEventListener("pointerenter",()=>show(el));el.addEventListener("focus",()=>show(el));el.addEventListener("pointerleave",()=>tip.hidden=true);el.addEventListener("blur",()=>tip.hidden=true)});
}

function renderVocab14Old(){
  const pool=VERBS.length+NOUNS.length+PHRASES.length,q=vq.trim().toLowerCase();
  const hit=(j,t)=>!q||j.toLowerCase().includes(q)||t.toLowerCase().includes(q);
  const mem=id=>vmem==="all"||(vmem==="known"?known.has(id):!known.has(id));
  const kb=(id,l)=>`<button class="kb" data-act="known" data-v="${esc(id)}" aria-pressed="${known.has(id)}" aria-label="${known.has(id)?"เอา "+esc(l)+" ออกจากคำที่จำแล้ว":"จำ "+esc(l)+" แล้ว"}">${known.has(id)?"จำแล้ว ✓":"ยังไม่จำ"}</button>`;
  const vcard=v=>`<article class="word">${say(v.masu)}<div><p class="j" lang="ja">${v.masu}</p><p class="jp ink${GROUP[v.group].k}" style="font-weight:700">→ ${v.te}</p><p class="mut">${v.th}</p><div class="row" style="margin-top:6px">${gb(v.group)}${kb("v:"+v.masu,v.masu)}</div></div></article>`;
  const pcard=([j,t],k,pre)=>`<article class="word">${say(j)}<div><p class="j" lang="ja">${j}</p><p class="mut">${t}</p><div class="row" style="margin-top:6px"><span class="pill mid">${k}</span>${kb(pre+j,j)}</div></div></article>`;
  const vs=VERBS.filter(v=>hit(v.masu+" "+v.te,v.th)&&mem("v:"+v.masu));
  const ns=NOUNS.filter(([j,t])=>hit(j,t)&&mem("n:"+j)),ps=PHRASES.filter(([j,t])=>hit(j,t)&&mem("p:"+j));
  const sv=vkind==="all"||vkind==="verb",sn=vkind==="all"||vkind==="noun",sp=vkind==="all"||vkind==="phrase";
  const total=(sv?vs.length:0)+(sn?ns.length:0)+(sp?ps.length:0);
  const fb=(act,cur,list)=>list.map(([k,l])=>`<button class="btn ${cur===k?"solid":""}" data-act="${act}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join("");
  const body=`
   ${total===0?`<div class="empty"><b>ไม่พบคำนี้</b><p class="mut">ลองคำสั้นลง หรือล้างช่องค้นหา</p><button class="btn" data-act="vclear">ล้างคำค้น</button></div>`:""}

const VOC=[...VERBS.filter(v=>!v.review).map(v=>({jp:v.masu,th:v.th})),...NOUNS.map(([jp,th])=>({jp,th})),...PHRASES.map(([jp,th])=>({jp,th}))];
const TF={
 k:{label:"〜て ください",cue:th=>`ขอให้${th}`,make:v=>v.te+" ください"},
 i:{label:"〜て います",cue:th=>`กำลัง${th}อยู่`,make:v=>v.te+" います"},
 m:{label:"〜ましょうか",cue:th=>`ให้ฉัน${th}ให้ไหม`,make:v=>v.masu.replace(/ます$/,"ましょうか")},
 n:{label:"〜て いません",cue:th=>`ไม่ได้กำลัง${th}อยู่`,make:v=>v.te+" いません"}};
function pickVerbs(level,n,exclude){
  const ok=v=>!(exclude&&exclude.has(v.masu));
  if(level==="easy")return shuffle(VERBS.filter(v=>!v.review&&!TRAPS.has(v.masu)&&ok(v))).slice(0,n);
  if(level==="mid")return shuffle(VERBS.filter(ok)).slice(0,n);
  const all=[...VERBS,...EXTRA].filter(ok),tr=shuffle(all.filter(v=>TRAPS.has(v.masu))).slice(0,Math.ceil(n/2));
  return shuffle([...tr,...shuffle(all.filter(v=>!tr.includes(v))).slice(0,n-tr.length)]);
}
function wrongTe(v){
  const stem=v.masu.slice(0,-2),last=stem.slice(-1),head=stem.slice(0,-1);
  const c=[stem+"て",stem+"って",head+(I_TO[last]||"って"),head+"いて",head+"って",head+"んで",head+"いで",head+"して"];
  if(v.masu==="いきます")c.unshift("いいて");
  return [...new Set(c)].filter(x=>x!==v.te&&x.length>=2);
}
const optsOf=(right,wrongs,k)=>{const o=shuffle([right,...shuffle(wrongs).slice(0,k-1)]);return{options:o,answer:o.indexOf(right)}};
function gen(d,level){
  if(curL!==14)return genG(d,level);
  const L=LEVELS[level],n=L.n,k=L.opts;
  if(d==="A")return pickVerbs(level,n).map(v=>({kind:"type",q:v.masu,th:v.th,say:v.masu,main:v.masu,sub:v.th,answer:v.te,group:v.group,hint:level==="easy"?"show":level==="mid"?"button":"none",ph:"รูป て"}));
  if(d==="B")return shuffle(SITU).slice(0,n).map(s=>({kind:"choice",q:s.prompt,th:s.th,top:s.th,main:s.prompt,...optsOf(s.a,s.d,k),sayDone:s.prompt.replace("（　）",s.a)}));
  if(d==="C")return pickVerbs(level,n).map(v=>({kind:"choice",once:true,groups:true,q:v.masu,th:v.th,say:v.masu,main:v.masu,sub:v.th,options:["I","II","III"],answer:["I","II","III"].indexOf(v.group)}));
  if(d==="D")return pickVerbs(level,n).map(v=>({kind:"choice",q:v.masu,th:v.th,say:v.masu,main:v.masu,sub:`${v.th} · รูป て คือข้อไหน`,...optsOf(v.te,level==="easy"?wrongTe(v).slice(0,2):wrongTe(v).slice(0,5),k),sayDoneOpt:true}));
  if(d==="E"){
    const ts=level==="easy"?["k"]:level==="mid"?["k","i"]:["k","i","m","n"];
    return pickVerbs(level,n,new Set(["ふります","できます","います","しにます"])).map((v,j)=>{const t=TF[ts[j%ts.length]],ans=t.make(v);return{kind:"type",q:`${v.masu} → ${t.label}`,th:t.cue(v.th),say:v.masu,main:v.masu,sub:t.cue(v.th),label:level==="hard"?"":t.label,teHint:level==="easy"?v.te:"",answer:ans,ph:"พิมพ์ทั้งวลี"}}).sort(()=>Math.random()-.5);
  }
  if(d==="F")return pickVerbs(level,n).map(v=>{
    if(level==="hard")return{kind:"type",listen:v.te,q:v.te,th:v.th,main:v.te,sub:"พิมพ์รูป て ที่ได้ยิน",answer:v.te,ph:"รูป て ที่ได้ยิน"};
    const others=[...VERBS,...EXTRA].filter(x=>x.te!==v.te&&x.masu!==v.masu).map(x=>x.masu);
    return{kind:"choice",listen:v.te,q:v.te,th:v.th,main:v.te,sub:"ฟังรูป て แล้วเลือกรูป ます ที่มาของคำนี้",...optsOf(v.masu,others,k)};
  });
  if(d==="G"){const pool=ORDER[level];return shuffle(pool).slice(0,Math.min(n,pool.length)).map(([ch,th,dis])=>({kind:"order",q:ch.join(" "),th,top:th,chunks:ch,bank:shuffle(dis?[...ch,dis]:ch),answer:ch.join(" ")}))}
  if(d==="H")return shuffle(VOC).slice(0,n).map(it=>{
    const rev=level==="hard"&&Math.random()<.5,others=VOC.filter(x=>x!==it);
    return rev?{kind:"choice",q:it.jp,th:it.th,main:it.th,mainTh:true,sub:"คำนี้ภาษาญี่ปุ่นคือข้อไหน",jpOpts:true,...optsOf(it.jp,others.map(x=>x.jp),k),sayDone:it.jp}
      :{kind:"choice",q:it.jp,th:it.th,say:it.jp,main:it.jp,sub:"แปลว่าอะไร",thOpts:true,...optsOf(it.th,others.map(x=>x.th),k)};
  });
  return[];
}
const expectOf=q=>q.kind==="choice"?(q.groups?`${GROUP[q.options[q.answer]].color} ${GROUP[q.options[q.answer]].name}`:q.options[q.answer]):q.answer;
const optLabel=(q,k)=>q.groups?`${GROUP[q.options[k]].color} ${GROUP[q.options[k]].name}`:q.options[k];

function choose(i,k){
  const q=cur.qs[i];if(isDone(q)||q.wrong.includes(k))return;

   case "settings":{const p=$("#settings"),o=p.hidden;p.hidden=!o;t.setAttribute("aria-expanded",o);break}
   case "skin":applySkin(v);break;
   case "font":applyFont(v);break;
   case "top":window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});break;
   case "mix":mixIdx=(mixIdx+(+v)+VERBS.length)%VERBS.length;$("#mixSel").value=mixIdx;renderMix();break;
   case "known":known.has(v)?known.delete(v):known.add(v);store.set("known",[...known]);renderVocab();break;
   case "kind":vkind=v;renderVocab();break;
   case "mem":vmem=v;renderVocab();break;
   case "vclear":vq="";$("#vsearch").value="";renderVocab();break;
   case "drill":cur.drill=v;setPref();newSet();lastResult=null;renderPractice();break;
   case "level":cur.level=v;setPref();newSet();lastResult=null;renderPractice();break;
   case "rand":{const ks=Object.keys(DM.names).filter(d=>d!==cur.drill);cur.drill=ks[Math.floor(Math.random()*ks.length)];setPref();newSet();lastResult=null;renderPractice();const c=$("#drillCard");if(c)c.scrollIntoView({block:"start",behavior:"smooth"});break}
   case "reroll":newSet();renderPractice();break;
   case "q-hint":cur.qs[i].hintOn=true;renderPractice();break;
   case "q-reveal":reveal(i);break;
   case "q-pick":choose(i,+t.dataset.k);break;
   case "o-add":{const q=cur.qs[i];if(!isDone(q)){q.picked.push(+t.dataset.k);if(q.st==="bad")q.st="idle";renderPractice()}break}
   case "o-un":{const q=cur.qs[i];if(!isDone(q)){q.picked=q.picked.filter(j=>j!==+t.dataset.k);if(q.st==="bad")q.st="idle";renderPractice()}break}
   case "o-clear":{const q=cur.qs[i];if(!isDone(q)){q.picked=[];if(q.st==="bad")q.st="idle";renderPractice()}break}
   case "o-check":checkOrder(i);break;
   case "rec-start":startRec();break;
   case "rec-end":finishRec();break;
   case "rec-cancel":cancelRec();break;
   case "go-rec":setTab("practice");startRec();break;
   case "hist-wrong":histWrong=!histWrong;renderHistory();break;
   case "hist-clear":confirmClear=true;renderHistory();break;
   case "hist-clear-no":confirmClear=false;renderHistory();break;
   case "hist-clear-yes":hist=[];store.set("hist",hist);confirmClear=false;lastResult=null;renderHistory();break;
  }
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.qin!=null)cur.qs[+t.dataset.qin].val=t.value});
document.addEventListener("change",e=>{if(e.target.id==="mixSel"){mixIdx=+e.target.value;renderMix()}if(e.target.id==="gmixSel")renderGMix(+e.target.value)});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form!=="q")return;e.preventDefault();answerType(+f.dataset.i)});
const topBtn=$("#top");addEventListener("scroll",()=>topBtn.classList.toggle("show",scrollY>400),{passive:true});

setLesson(curL,true);
setTab(["home","grammar","vocab","practice","hist"].includes(tab)?tab:"home",true);
</script>
